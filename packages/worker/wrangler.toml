name = "w11-invest-library"
main = "src/index.ts"
compatibility_date = "2026-08-25"
compatibility_flags = ["nodejs_compat"]

# **workers.dev を有効にしないこと。**
# Cloudflare Access はゾーンのホスト名に紐づくので、`*.workers.dev` から来た
# リクエストには適用されない。有効にすると、そのURLでダッシュボードが
# 認証なしに開いてしまう。site.ts 側でも想定外ホストは 404 にしてあるが、
# そもそも口を開けない。
workers_dev = false

# ============================================================
# 既定（ローカル開発）
# ============================================================
# **ここにルートとホスト名を書かない。**
# `wrangler dev` は routes が設定されていると、その 1 本目のホスト名を
# 模擬してリクエストを組み立てる。本番のホスト名を既定に置くと、
# ローカルで LP しか開けなくなる（実際にそうなった）。
#
# ホスト名が空だと site.ts がパスで振り分けるので、
# `/lp` 配下が LP、それ以外がダッシュボードとして両方確認できる。
#
# 本番の設定は下の [env.production]。デプロイは:
#   npm run deploy        （= wrangler deploy --env production）

[[d1_databases]]
binding = "INVEST_DB"
database_name = "invest-db"
# `wrangler d1 create invest-db` の出力を貼る
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[r2_buckets]]
binding = "INVEST_R2"
bucket_name = "invest-snapshots"

[triggers]
# 19:30 JST（10:30 UTC 月〜金）に本走。J-Quants の当日データが出揃ったあとを狙う。
# 07:00 JST（22:00 UTC 月〜金 = JST では火〜土の朝）に取りこぼしの回収。
# 回収run が狙うのは**前日**（scheduledTargetDate）。当日はまだ場が開いていない。
#
# **曜日に 0 を書かない。** `0 22 * * 0-4` は Cloudflare に
# `invalid cron string [code: 10100]` で拒否された（実際に踏んだ）。
# 1-7 の範囲で書く。`scripts/preflight.mjs` が検査している。
#
# **Cron は 1 本にまとめてある。** ステップごとの再実行は job_runs で制御する。
crons = ["30 10 * * 1-5", "0 22 * * 1-5"]

[observability]
enabled = true

[vars]
# 正式名。LP の <title> と og:title、プライバシーポリシーの見出しに使う。
SITE_NAME = "ゴールデンクロスーインカムゲインを究める資産運用"
# 短縮名。ヘッダーのブランド表記と、ダッシュボードの <title> の接尾辞。
# 正式名は 24 文字あり、ヘッダーに入れると狭い画面で折り返す。
SITE_SHORT_NAME = "ゴールデンクロス"
# 空 = ローカル扱い。`/lp` 配下が LP、それ以外がダッシュボード（site.ts）。
LP_HOSTNAME = ""
APP_HOSTNAME = ""
# Phase 1 の対象市場。Phase 3 以降はここに 'US' などを足す。
MARKETS = "JP"
# 対象銘柄数の上限。Phase 1 は 500。Phase 2 で外す。
UNIVERSE_LIMIT = "500"
# ニュース分析に使うモデル（Phase 1b）。
NEWS_MODEL = "claude-opus-5"
# **"true" にする前に docs/DATA-SOURCES.md の「再配信の可否」を埋めること。**
MEMBER_SIGNUP_ENABLED = "false"
# Google の利用条件を確認するまで "false"（docs/DATA-SOURCES.md の 5）
QUOTES_PUBLIC_ENABLED = "false"
# 両方を設定すると、リクエストごとに Access の JWT を検証する。
# ローカルは空でよい（画面上部に警告が出る）。
CF_ACCESS_TEAM_DOMAIN = ""
CF_ACCESS_AUD = ""
JQUANTS_BASE_URL = "https://api.jquants.com/v2"
# API の項目名が変わったときの逃げ道。コードを直さずここで別名を足せる。
# 例: {"close":["C","Close","ClosePrice"]}
# `npm run check:datasource` が実際に返ってきた項目名を表示する。
JQUANTS_FIELD_ALIASES = "{}"

# ============================================================
# 本番
# ============================================================
# **LP とアプリを別ホストに分けている。**
# 同じホストでパスだけ分けると、Access のポリシーをパス単位で書くことになり、
# ルートを 1 本足しただけで市場データが公開側に漏れる余地ができる。
#
# wrangler は名前付き環境へ vars / d1 / r2 / triggers を**引き継がない**ので、
# 下は既定の写しになっている。ずれると本番だけ壊れるため、
# `test/wrangler.test.mjs` が両者の項目の一致を検査している。

[env.production]
workers_dev = false

[[env.production.routes]]                          # LP（公開）
pattern = "goldencross-incomegains.com/*"
zone_name = "goldencross-incomegains.com"

[[env.production.routes]]                          # ダッシュボード（Access の後ろ）
pattern = "app.goldencross-incomegains.com/*"
zone_name = "goldencross-incomegains.com"

# www を使うなら足す。Worker が apex へ 301 で寄せる。
# [[env.production.routes]]
# pattern = "www.goldencross-incomegains.com/*"
# zone_name = "goldencross-incomegains.com"

[[env.production.d1_databases]]
binding = "INVEST_DB"
database_name = "invest-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[env.production.r2_buckets]]
binding = "INVEST_R2"
bucket_name = "invest-snapshots"

[env.production.triggers]
crons = ["30 10 * * 1-5", "0 22 * * 1-5"]

[env.production.observability]
enabled = true

[env.production.vars]
SITE_NAME = "ゴールデンクロスーインカムゲインを究める資産運用"
SITE_SHORT_NAME = "ゴールデンクロス"
LP_HOSTNAME = "goldencross-incomegains.com"
APP_HOSTNAME = "app.goldencross-incomegains.com"
MARKETS = "JP"
UNIVERSE_LIMIT = "500"
NEWS_MODEL = "claude-opus-5"
MEMBER_SIGNUP_ENABLED = "false"
# Google の利用条件を確認するまで "false"（docs/DATA-SOURCES.md の 5）
QUOTES_PUBLIC_ENABLED = "false"
# **Cloudflare Access のアプリケーションを作ったら埋める。**
# 空のままだと画面上部に赤い警告が出る（docs/DEPLOY.md 手順 9）。
CF_ACCESS_TEAM_DOMAIN = ""
CF_ACCESS_AUD = ""
JQUANTS_BASE_URL = "https://api.jquants.com/v2"
JQUANTS_FIELD_ALIASES = "{}"

# --- Secrets（wrangler secret put --env production で登録。ここには書かない）---
# JQUANTS_API_KEY   : J-Quants の API キー
# ANTHROPIC_API_KEY : ニュース分析用（Phase 1b）
