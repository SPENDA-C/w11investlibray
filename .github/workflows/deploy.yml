name: デプロイ

# 本番（Cloudflare Workers）へ出す。
#
# **ここが唯一の自動デプロイ経路。** 手元の `npm run deploy` と同じものを
# 同じ順で走らせる。片方だけ条件を足すとずれるので、
# 検証の中身は package.json と scripts/preflight.mjs 側に置いてある。

on:
  push:
    branches: [claude/stock-screening-ai-library-35qwmk]
    # ドキュメントだけの変更では Worker の中身が変わらないので出さない。
    # LP の文面は packages/worker/src/ui/lp.ts にあるので、ここには含めない。
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

# **同時に 2 本走らせない。** 後から来たものを待たせる。
# cancel-in-progress を true にすると wrangler deploy の途中で
# 止まることがあり、どの版が出たのか分からなくなる。
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # **秘密情報の確認を先に。** 無いまま wrangler を呼ぶと
      # 「認証に失敗」としか出ず、どこで登録するのか分からない。
      - name: Secrets が登録されているか
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -z "$TOKEN" ]   && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$ACCOUNT" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::未登録の Secret:$missing"
            echo "リポジトリの Settings → Secrets and variables → Actions で登録する。"
            echo "取り方は docs/GO-LIVE.md の B3 の表。"
            exit 1
          fi

          # **値の形も見る。** 登録されていても、改行や空白が一緒に
          # 貼られていると wrangler は
          #   Invalid format for Authorization header [code: 6111]
          # としか言わない。どこが悪いのか分からないので、ここで先に言う。
          # **値そのものは絶対に出力しない。** 長さと文字種だけを見る。
          check_shape() {
            name=$1
            value=$2
            len=${#value}
            stripped=$(printf '%s' "$value" | tr -d '[:space:]')
            if [ "${#stripped}" -ne "$len" ]; then
              echo "::error::$name に空白か改行が混ざっている（長さ $len、空白を除くと ${#stripped}）"
              echo "  コピーするとき、前後の改行や空白まで拾っている。"
              echo "  Secret を開いて値を消し、トークンだけを貼り直す。"
              return 1
            fi
            # **呼び出し側の bad を踏まないよう、別の名前にする。**
            # 同じ名前にして happy path が壊れた（空文字で上書きされ、
            # [ "$bad" -eq 0 ] が integer expression expected で落ちた）。
            badchars=$(printf '%s' "$value" | LC_ALL=C tr -d 'A-Za-z0-9_-')
            if [ -n "$badchars" ]; then
              echo "::error::$name に使えない文字が入っている（${#badchars} 文字）"
              echo "  使えるのは英数字と _ と - だけ。全角の記号や引用符が"
              echo "  混ざっていないか確認する。"
              return 1
            fi
            return 0
          }

          bad=0
          check_shape CLOUDFLARE_API_TOKEN "$TOKEN" || bad=1
          check_shape CLOUDFLARE_ACCOUNT_ID "$ACCOUNT" || bad=1
          [ "$bad" -eq 0 ] || exit 1

          # **種類を見分ける。長さを決め打ちしない。**
          # Cloudflare は 2026-04 に接頭辞つきの形式を導入した
          # （接頭辞＋40 文字＋8 文字のチェックサム）:
          #
          #   cfat_…  Account API Token  53 文字  ← wrangler で使える
          #   cfut_…  User API Token     53 文字  ← 使える
          #   cfk_…   User API Key               ← **Token ではない**
          #   （接頭辞なし）40 文字              ← 旧形式。まだ有効
          #
          # 以前ここで「40 文字ちょうど」を必須にしていて、正しい
          # cfat_ トークンを弾いた。**形式は変わる。**確信のあるものだけ
          # 落とし、知らない形は通して Cloudflare に判断させる。
          case "$TOKEN" in
            cfk_*)
              echo "::error::CLOUDFLARE_API_TOKEN が cfk_ で始まっている。"
              echo "  これは User API **Key** で、API **Token** とは別物。"
              echo "  Authorization: Bearer では使えない（6111 になる）。"
              echo "  API Tokens の欄から Token を作ること。"
              exit 1
              ;;
            cfat_*|cfut_*)
              echo "API Token（接頭辞つきの新形式・${#TOKEN} 文字）"
              ;;
            *)
              if [ ${#TOKEN} -eq 37 ] && printf '%s' "$TOKEN" | LC_ALL=C grep -qE '^[0-9a-f]{37}$'; then
                echo "::error::CLOUDFLARE_API_TOKEN が 37 桁の 16 進数。"
                echo "  **これは Global API Key です。** API Token とは別物で、"
                echo "  Authorization: Bearer では使えない（6111 になる）。"
                echo "  dash.cloudflare.com → API Tokens → Create Token"
                echo "  → 「Edit Cloudflare Workers」テンプレート。"
                exit 1
              fi
              if [ ${#TOKEN} -ne 40 ]; then
                # **落とさない。** 知らない形式かもしれない。
                echo "::warning::CLOUDFLARE_API_TOKEN が見慣れない形（${#TOKEN} 文字・接頭辞なし）"
                echo "  旧形式は 40 文字、新形式は cfat_ / cfut_ で始まる 53 文字。"
                echo "  このまま進めて、Cloudflare の返事を見る。"
              fi
              ;;
          esac
          echo "Secret の形は問題なし（トークン ${#TOKEN} 文字 / アカウント ${#ACCOUNT} 文字）"
