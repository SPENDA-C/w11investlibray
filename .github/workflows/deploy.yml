name: デプロイ

# 本番（Cloudflare Workers）へ出す。
#
# **ここが唯一の自動デプロイ経路。** 手元の `npm run deploy` と同じものを
# 同じ順で走らせる。片方だけ条件を足すとずれるので、
# 検証の中身は package.json と scripts/preflight.mjs 側に置いてある。

on:
  push:
    branches: [claude/stock-screening-ai-library-35qwmk]
    # ドキュメントだけの変更では Worker の中身が変わらないので出さない。
    # LP の文面は packages/worker/src/ui/lp.ts にあるので、ここには含めない。
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

# **同時に 2 本走らせない。** 後から来たものを待たせる。
# cancel-in-progress を true にすると wrangler deploy の途中で
# 止まることがあり、どの版が出たのか分からなくなる。
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # **秘密情報の確認を先に。** 無いまま wrangler を呼ぶと
      # 「認証に失敗」としか出ず、どこで登録するのか分からない。
      - name: Secrets が登録されているか
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -z "$TOKEN" ]   && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$ACCOUNT" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::未登録の Secret:$missing"
            echo "リポジトリの Settings → Secrets and variables → Actions で登録する。"
            echo "取り方は docs/GO-LIVE.md の B3 の表。"
            exit 1
          fi

          # **値の形も見る。** 登録されていても、改行や空白が一緒に
          # 貼られていると wrangler は
          #   Invalid format for Authorization header [code: 6111]
          # としか言わない。どこが悪いのか分からないので、ここで先に言う。
          # **値そのものは絶対に出力しない。** 長さと文字種だけを見る。
          check_shape() {
            name=$1
            value=$2
            len=${#value}
            stripped=$(printf '%s' "$value" | tr -d '[:space:]')
            if [ "${#stripped}" -ne "$len" ]; then
              echo "::error::$name に空白か改行が混ざっている（長さ $len、空白を除くと ${#stripped}）"
              echo "  コピーするとき、前後の改行や空白まで拾っている。"
              echo "  Secret を開いて値を消し、トークンだけを貼り直す。"
              return 1
            fi
            # **呼び出し側の bad を踏まないよう、別の名前にする。**
            # 同じ名前にして happy path が壊れた（空文字で上書きされ、
            # [ "$bad" -eq 0 ] が integer expression expected で落ちた）。
            badchars=$(printf '%s' "$value" | LC_ALL=C tr -d 'A-Za-z0-9_-')
            if [ -n "$badchars" ]; then
              echo "::error::$name に使えない文字が入っている（${#badchars} 文字）"
              echo "  使えるのは英数字と _ と - だけ。全角の記号や引用符が"
              echo "  混ざっていないか確認する。"
              return 1
            fi
            return 0
          }

          bad=0
          check_shape CLOUDFLARE_API_TOKEN "$TOKEN" || bad=1
          check_shape CLOUDFLARE_ACCOUNT_ID "$ACCOUNT" || bad=1
          [ "$bad" -eq 0 ] || exit 1

          # **種類を見分ける。長さを決め打ちしない。**
          # Cloudflare は 2026-04 に接頭辞つきの形式を導入した
          # （接頭辞＋40 文字＋8 文字のチェックサム）:
          #
          #   cfat_…  Account API Token  53 文字  ← wrangler で使える
          #   cfut_…  User API Token     53 文字  ← 使える
          #   cfk_…   User API Key               ← **Token ではない**
          #   （接頭辞なし）40 文字              ← 旧形式。まだ有効
          #
          # 以前ここで「40 文字ちょうど」を必須にしていて、正しい
          # cfat_ トークンを弾いた。**形式は変わる。**確信のあるものだけ
          # 落とし、知らない形は通して Cloudflare に判断させる。
          case "$TOKEN" in
            cfk_*)
              echo "::error::CLOUDFLARE_API_TOKEN が cfk_ で始まっている。"
              echo "  これは User API **Key** で、API **Token** とは別物。"
              echo "  Authorization: Bearer では使えない（6111 になる）。"
              echo "  API Tokens の欄から Token を作ること。"
              exit 1
              ;;
            cfat_*|cfut_*)
              echo "API Token（接頭辞つきの新形式・${#TOKEN} 文字）"
              ;;
            *)
              if [ ${#TOKEN} -eq 37 ] && printf '%s' "$TOKEN" | LC_ALL=C grep -qE '^[0-9a-f]{37}$'; then
                echo "::error::CLOUDFLARE_API_TOKEN が 37 桁の 16 進数。"
                echo "  **これは Global API Key です。** API Token とは別物で、"
                echo "  Authorization: Bearer では使えない（6111 になる）。"
                echo "  dash.cloudflare.com → API Tokens → Create Token"
                echo "  → 「Edit Cloudflare Workers」テンプレート。"
                exit 1
              fi
              if [ ${#TOKEN} -ne 40 ]; then
                # **落とさない。** 知らない形式かもしれない。
                echo "::warning::CLOUDFLARE_API_TOKEN が見慣れない形（${#TOKEN} 文字・接頭辞なし）"
                echo "  旧形式は 40 文字、新形式は cfat_ / cfut_ で始まる 53 文字。"
                echo "  このまま進めて、Cloudflare の返事を見る。"
              fi
              ;;
          esac
          echo "Secret の形は問題なし（トークン ${#TOKEN} 文字 / アカウント ${#ACCOUNT} 文字）"

      # **ci.yml と同じ検証をここでも走らせる。**
      # 別ワークフローの成否は needs: で参照できない（workflow_run は
      # 別イベントとして走り、順序が保証されない）。
      # デプロイの門は、デプロイのジョブ自身が持つ。
      - name: 型チェック
        run: npm run typecheck
      - name: テスト
        run: npm test
      - name: サンプルデータがスキーマに投入できるか
        run: node scripts/verify-seed.mjs

      # preflight → wrangler deploy --env production。
      # **ここで条件を書き直さない。** workers_dev・database_id・
      # 運営者情報の確認は scripts/preflight.mjs が持っている。
      #
      # **このステップを消さないこと。** 一度消して、
      # 「デプロイ」が何もせずに緑を返す状態が続いた（067d5ff）。
      # test/scripts.test.mjs が、この名前のステップの存在を検査している。
      - name: デプロイ
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy -w @invest/worker

      # **宛先は LP ホスト。** routes/lp.ts が LP 側でも /api/health を
      # 返すので、app ホストに Access を掛けたあともここは通る。
      # app ホストに向けると、Access を掛けた日からデプロイが落ちる。
      - name: 生きているか確認
        run: |
          url="https://goldencross-incomegains.com/api/health"
          attempts=3
          for i in $(seq 1 $attempts); do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 20 "$url" || echo 000)
            [ "$code" = "200" ] && break
            if [ "$i" -lt "$attempts" ]; then
              echo "試行 $i: HTTP $code。5 秒待って再試行"
              sleep 5
            else
              echo "試行 $i: HTTP $code"
            fi
          done
          cat /tmp/health.json || true
          echo
          if [ "$code" != "200" ]; then
            echo "::error::デプロイ後の $url が HTTP $code"
            echo "デプロイ自体は成功している。ルートか DNS を疑う（docs/DEPLOY.md の「ドメインに反応しない」）。"
            exit 1
          fi

      # **出した版が本当に出ているかを見る。**
      # デプロイが緑でも、配信されているのが古い版だったことがある
      # （デプロイのステップごと消えていた）。/api/health は中身が変わらない
      # ので気付けない。**公開ページの中身そのものを見る。**
      - name: 出した版が配信されているか
        run: |
          url="https://goldencross-incomegains.com/"
          curl -sS --max-time 20 -H 'cache-control: no-cache' "$url?v=${GITHUB_SHA}" > /tmp/lp.html || true
          bytes=$(wc -c < /tmp/lp.html)
          echo "取得 ${bytes} バイト"

          # いまのコードが必ず出す印。無ければ、配信されているのは別の版。
          node -e '
            const { readFileSync } = require("node:fs");
            const live = readFileSync("/tmp/lp.html", "utf8");
            const marks = [".container", ".site-head"];
            const missing = marks.filter((m) => !live.includes(m));
            if (missing.length > 0) {
              console.log("::error::公開ページに " + missing.join(", ") + " が無い。LP が配信されていない");
              process.exit(1);
            }
            console.log("公開ページは LP を返している");
          '

      # **LP に JavaScript と外部通信を増やさない**（CLAUDE.md）。
      # コード側は test が見ているが、**Cloudflare が配信時に足すものは
      # コードからは見えない。** Zaraz や Web Analytics を管理画面で
      # 有効にすると、ここに <script> が差し込まれる。
      # /privacy に「解析タグは設置していません」と書いてあるので、
      # 差し込まれたままだとその記述が事実と違うことになる。
      - name: LP に script と外部通信が増えていないか
        run: |
          node -e '
            const { readFileSync } = require("node:fs");
            const live = readFileSync("/tmp/lp.html", "utf8");
            let bad = 0;

            const scripts = live.match(/<script\b/gi) ?? [];
            if (scripts.length > 0) {
              bad = 1;
              console.log("::warning::公開ページに <script> が " + scripts.length + " 個ある（コード側は 0）");
              for (const m of live.matchAll(/<script[^>]*src="([^"]+)"/gi)) console.log("    src: " + m[1]);
              if (/zaraz/i.test(live)) console.log("    → Cloudflare Zaraz。ダッシュボード → 対象ゾーン → Zaraz で無効化");
              if (/cloudflareinsights/i.test(live)) console.log("    → Cloudflare Web Analytics。Analytics → Web Analytics でサイトを外す");
            }

            const allowed = ["fonts.googleapis.com", "fonts.gstatic.com", "goldencross-incomegains.com"];
            const hosts = new Set();
            for (const m of live.matchAll(/https?:\/\/([a-z0-9.-]+)/gi)) hosts.add(m[1].toLowerCase());
            const extra = [...hosts].filter((h) => !allowed.some((a) => h === a || h.endsWith("." + a)));
            if (extra.length > 0) {
              bad = 1;
              console.log("::warning::許していない外部ホストが公開ページにある: " + extra.join(", "));
            }

            if (bad === 0) console.log("LP に script は無く、外部は Google Fonts だけ");
            else console.log("詳細: CLAUDE.md の「画面まわり」と /privacy の「外部サービス」");
          '
