name: 決算カレンダーの取り込み

# Finnhub の決算カレンダーを D1 に入れる。
#
# **米国株のみ。** 日本株（7203.T）は 403
# 「You don't have access to this resource」で、契約プランの範囲外だった
# （docs/DATA-SOURCES.md の 6）。日本株は別のソースを決めてから足す。
#
# 予定は動くので、毎日取り直して上書きする。

on:
  schedule:
    # 平日の朝（21:40 UTC ≒ 翌 6:40 JST）。現在値の取り込みと分ける。
    - cron: '40 21 * * 1-5'
  workflow_dispatch:
    inputs:
      days:
        description: '何日先まで取るか'
        default: '90'
      apply:
        description: 'D1 へ実際に流し込む'
        type: boolean
        default: false

concurrency:
  group: earnings
  cancel-in-progress: false

jobs:
  earnings:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # **定時実行のときは、未設定を失敗にしない。** 設定が揃う前から
      # 毎平日 赤くなり続けると、失敗を無視する癖がつく（quotes.yml と同じ）。
      - name: Secret が登録されているか
        id: secrets
        env:
          KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=false" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "::notice::FINNHUB_API_KEY が未登録（定時実行なので飛ばす）"
            exit 0
          fi
          echo "::error::FINNHUB_API_KEY が未登録"
          echo "Settings → Secrets and variables → Actions で登録する。"
          exit 1

      - name: 取得して SQL を書き出す
        if: steps.secrets.outputs.ready == 'true'
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        # **npm を挟まず node を直接呼ぶ。** 入れ子の npm がフラグを食う。
        run: |
          npm run build -w @invest/batch --silent
          days="${{ inputs.days || '90' }}"
          to=$(date -u -d "+${days} days" +%Y-%m-%d)
          echo "今日から ${to} まで"
          node packages/batch/.build/cli.mjs earnings --to "$to" --out out/earnings.sql

      - name: 成果物として保存
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: earnings-${{ github.run_number }}
          path: out/earnings.sql
          retention-days: 14

      # 定時実行では常に流し込む。手動のときだけ apply で選べるのは、
      # **初回に中身を見てから入れたい**ため。
      - name: D1 へ流し込む
        if: ${{ steps.secrets.outputs.ready == 'true' && (github.event_name == 'schedule' || inputs.apply) }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: packages/worker
        # **--env production を落とさないこと。**
        run: npx wrangler d1 execute invest-db --remote --env production --file=../../out/earnings.sql

      # **落ちた理由を推測で案内しない。** wrangler は
      # 「Authentication error [code: 10000] / 権限を確認してください」としか
      # 言わないので、どこまで通るかを実際に測って、次にやることを 1 つに絞る。
      # トークンの値は出さない（長さと種類だけ）。
      - name: 落ちたら D1 の権限を測る
        if: failure()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/check-d1-token.mjs
