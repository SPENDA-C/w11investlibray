name: バックフィル

# 過去の日足を取得して D1 へ流し込む。手動実行のみ。
#
# **Worker ではなくここで回す理由**
#   500 銘柄 × 10 年 ≒ 122 万行。D1 の無料枠（10 万行/日）では 2 週間かかり、
#   取得も約 2,450 リクエストになって Worker の実行時間に収まらない。

on:
  workflow_dispatch:
    inputs:
      from:
        description: '開始日 (YYYY-MM-DD)'
        required: true
      to:
        description: '終了日 (YYYY-MM-DD)'
        required: true
      apply:
        description: 'D1 へ実際に流し込む'
        type: boolean
        default: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: 取得して SQL を生成
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        # **npm を挟まず node を直接呼ぶ。**
        # `npm run X -- args` の args は X の文字列の末尾に連結されるので、
        # script が入れ子になっていると内側の npm が `--from` を自分の
        # オプションとして食い、**フラグ名が消えて値だけが流れる**。
        # 実際それで落ちた（`--from と --to は必須。`）。
        # node に直接渡せば、npm の解釈は一切挟まらない。
        run: |
          npm run build -w @invest/batch --silent
          node packages/batch/.build/cli.mjs backfill \
            --from "${{ inputs.from }}" \
            --to "${{ inputs.to }}" \
            --out out/backfill.sql

      - name: 成果物として保存
        uses: actions/upload-artifact@v4
        with:
          name: backfill-${{ inputs.from }}-${{ inputs.to }}
          path: out/backfill-*.sql
          retention-days: 14

      - name: D1 へ流し込む
        if: ${{ inputs.apply }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: packages/worker
        # **--env production を落とさないこと。** 付けないと wrangler は既定の
        # [[d1_databases]] を見に行く。本番の D1 を指しているのは
        # [[env.production.d1_databases]] のほう（package.json の
        # db:migrate:remote も同じ理由で --env production を付けている）。
        # **必ず連番の順に流す。** market_calendar / symbols の INSERT が
        # prices_daily より先に来る必要がある（外部キー）。ファイル名は
        # ゼロ埋めしてあるので sort の順で正しい。
        # 途中で失敗しても、失敗した番号から手で再開できる
        # （ON CONFLICT DO NOTHING なので重ねて流しても壊れない）。
        run: |
          shopt -s nullglob
          files=(../../out/backfill-*.sql)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::out/backfill-*.sql が無い"
            exit 1
          fi
          for f in $(printf '%s\n' "${files[@]}" | sort); do
            echo "適用: $f"
            npx wrangler d1 execute invest-db --remote --env production --file="$f"
          done

      # **落ちた理由を推測で案内しない。** wrangler は
      # 「Authentication error [code: 10000] / 権限を確認してください」としか
      # 言わないので、どこまで通るかを実際に測って、次にやることを 1 つに絞る。
      # トークンの値は出さない（長さと種類だけ）。
      - name: 落ちたら D1 の権限を測る
        if: failure()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/check-d1-token.mjs
