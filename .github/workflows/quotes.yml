name: 現在値の取り込み

# Google スプレッドシート（GOOGLEFINANCE）の現在値を D1 に入れる。
#
# **なぜシートを経由するのか。** GOOGLEFINANCE は表計算の数式で API が無い。
# シートそのものが取得層になる。Google に市場データの取得をやらせて、
# こちらは読むだけ。
#
# **Claude も MCP も経路に入らない。** ここで完結する。

on:
  schedule:
    # 平日の米国市場が引けたあと（21:10 UTC ≒ 翌 6:10 JST）。
    # 分を 0 にしないのは、毎時 0 分に集中して遅延するのを避けるため。
    - cron: '10 21 * * 1-5'
  workflow_dispatch:
    inputs:
      max_age_hours:
        description: 'これより古い as_of なら取り込まない'
        default: '24'
      apply:
        description: 'D1 へ実際に流し込む'
        type: boolean
        default: false

concurrency:
  group: quotes
  cancel-in-progress: false

jobs:
  quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # **秘密情報の確認を先に。** 無いまま走ると Google が返すのは
      # invalid_grant などの一言で、どこを直すのか分からない。
      - name: Secrets が登録されているか
        env:
          SA: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET: ${{ secrets.QUOTES_SHEET_ID }}
        run: |
          missing=""
          [ -z "$SA" ]    && missing="$missing GOOGLE_SERVICE_ACCOUNT_JSON"
          [ -z "$SHEET" ] && missing="$missing QUOTES_SHEET_ID"
          if [ -n "$missing" ]; then
            echo "::error::未登録の Secret:$missing"
            echo "Settings → Secrets and variables → Actions で登録する。"
            echo "鍵の取り方と、シートをサービスアカウントに共有する手順は"
            echo "docs/DATA-SOURCES.md の 5 にある。"
            exit 1
          fi

      # **npm を挟まず node を直接呼ぶ。** `npm run X -- args` の args は
      # script 文字列の末尾に連結されるので、script が入れ子だと
      # 内側の npm が --sheet を自分のオプションとして食う（実際それで落ちた）。
      - name: シートを読んで SQL を書き出す
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          QUOTES_SHEET_ID: ${{ secrets.QUOTES_SHEET_ID }}
        run: |
          npm run build -w @invest/batch --silent
          node packages/batch/.build/cli.mjs sheet \
            --out out/quotes.sql \
            --max-age-hours "${{ inputs.max_age_hours || '24' }}"

      - name: 成果物として保存
        uses: actions/upload-artifact@v4
        with:
          name: quotes-${{ github.run_number }}
          path: out/quotes.sql
          retention-days: 14

      # 定時実行では常に流し込む。手動実行のときだけ apply で選べるように
      # してあるのは、**初回に中身を見てから入れたい**ため。
      - name: D1 へ流し込む
        if: ${{ github.event_name == 'schedule' || inputs.apply }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: packages/worker
        # **--env production を落とさないこと。** 付けないと wrangler は
        # 既定の [[d1_databases]] を見に行く。
        run: npx wrangler d1 execute invest-db --remote --env production --file=../../out/quotes.sql
